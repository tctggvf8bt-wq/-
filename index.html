<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デートのお誘い</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 85%;
            position: relative;
        }
        h1 {
            color: #ff4757;
            font-size: 22px;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            height: 50px;
            align-items: center;
        }
        .btn {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
        }
        #yes-btn {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        #no-btn {
            background-color: #f1f2f6;
            color: #747d8c;
            position: absolute;
            right: 20px;
        }
        .hidden {
            display: none !important;
        }
        input[type="datetime-local"] {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ff4757;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }
        .line-btn {
            background-color: #06C755;
            color: white;
            width: 100%;
            box-shadow: 0 4px 15px rgba(6, 199, 85, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ステップ 1: デートのお誘い -->
        <div id="step-1">
            <h1>大切なお知らせ 💌</h1>
            <p>今度、僕とデートに行きませんか？</p>
            <div class="btn-container">
                <button class="btn" id="yes-btn" onclick="goToStep2()">はい</button>
                <button class="btn" id="no-btn" onmouseover="moveNoButton()" ontouchstart="moveNoButton()">いいえ</button>
            </div>
        </div>

        <!-- ステップ 2: 日程選択 -->
        <div id="step-2" class="hidden">
            <h1>やったー！✨</h1>
            <p>ご都合の良い日時を選んでね！</p>
            <input type="datetime-local" id="date-picker">
            <button class="btn line-btn" onclick="sendLine()">約束を決定してLINEで伝える 💬</button>
        </div>
    </div>

    <script>
        // 「いいえ」ボタンをランダムに逃がす処理
        function moveNoButton() {
            const noBtn = document.getElementById('no-btn');
            const maxX = 80;
            const maxY = 40;
            const randomX = (Math.random() - 0.5) * maxX * 2;
            const randomY = (Math.random() - 0.5) * maxY * 2;
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function goToStep2() {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
        }

        function sendLine() {
            const dateVal = document.getElementById('date-picker').value;
            if (!dateVal) {
                alert("日時を選んでね！");
                return;
            }

            // 日時を見やすく整形（例: 2026-10-15T19:00 -> 2026/10/15 19:00）
            const formattedDate = dateVal.replace('-', '/').replace('-', '/').replace('T', ' ');

            // LINEで送信するメッセージ文章
            const message = `デートのお約束！✨\n【希望日時】\n${formattedDate}\n\n楽しみにしています🥰`;

            // LINE共有用URL（LINEアプリが起動してメッセージがセットされます）
            const lineUrl = `https://line.me/R/share?text=${encodeURIComponent(message)}`;

            window.location.href = lineUrl;
        }
    </script>
</body>
</html>
